# Test pipeline for SRM deployment tracking.
# Creates GitHub Deployments (ref = release tag, payload.region = region) and reports
# their status. The DigiCert GitHub App receives the deployment_status webhooks and
# forwards them to SRM, which links each deployment to the release with that tag.
name: SRM Deploy (test)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy (blank = latest release)'
        required: false
        default: ''
      targets:
        description: 'Comma-separated environment:region targets (region optional)'
        required: false
        default: 'staging:us-east-1,production:us-east-1,production:eu-west-1'
      simulate-failure:
        description: 'Report FAILURE instead of SUCCESS'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  plan:
    name: Resolve tag and targets
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    env:
      GH_TOKEN: ${{ github.token }}
      EVENT_NAME: ${{ github.event_name }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      INPUT_TAG: ${{ inputs.tag }}
      INPUT_TARGETS: ${{ inputs.targets }}
    steps:
      - name: Resolve
        id: resolve
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'release' ]; then
            tag="$RELEASE_TAG"
            targets='staging:us-east-1'
          else
            tag="$INPUT_TAG"
            targets="$INPUT_TARGETS"
            if [ -z "$tag" ]; then
              tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
            fi
          fi

          if ! printf '%s' "$tag" | grep -Eq '^[A-Za-z0-9._/-]{1,100}$'; then
            echo "::error::Invalid tag '$tag'"; exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --silent \
            || { echo "::error::Tag '$tag' does not exist"; exit 1; }

          matrix='[]'
          IFS=',' read -ra items <<< "$targets"
          for item in "${items[@]}"; do
            item="$(printf '%s' "$item" | tr -d '[:space:]')"
            [ -z "$item" ] && continue
            env_name="${item%%:*}"
            region=''
            [[ "$item" == *:* ]] && region="${item#*:}"
            printf '%s' "$env_name" | grep -Eq '^[A-Za-z0-9._-]{1,64}$' \
              || { echo "::error::Invalid environment '$env_name'"; exit 1; }
            [ -z "$region" ] || printf '%s' "$region" | grep -Eq '^[A-Za-z0-9._-]{1,64}$' \
              || { echo "::error::Invalid region '$region'"; exit 1; }
            matrix="$(jq -c --arg e "$env_name" --arg r "$region" '. + [{environment: $e, region: $r}]' <<< "$matrix")"
          done
          [ "$matrix" = '[]' ] && { echo '::error::No targets'; exit 1; }

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Deploying $tag to $matrix" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy ${{ needs.plan.outputs.tag }} → ${{ matrix.target.environment }} ${{ matrix.target.region }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: read
      deployments: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
      ENVIRONMENT: ${{ matrix.target.environment }}
      REGION: ${{ matrix.target.region }}
      SIMULATE_FAILURE: ${{ inputs.simulate-failure && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.tag }}

      - name: Create deployment
        id: deployment
        run: |
          set -euo pipefail
          prod=false
          [ "$ENVIRONMENT" = 'production' ] && prod=true
          args=(-f "ref=${TAG}" -f "environment=${ENVIRONMENT}"
                -f "description=Deploy ${TAG} to ${ENVIRONMENT} ${REGION}"
                -F 'auto_merge=false' -F "production_environment=${prod}"
                -F 'required_contexts[]')
          [ -n "$REGION" ] && args+=(-f "payload[region]=${REGION}")
          id="$(gh api "repos/${GITHUB_REPOSITORY}/deployments" "${args[@]}" --jq '.id')"
          echo "id=${id}" >> "$GITHUB_OUTPUT"
          gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses" \
            -f 'state=in_progress' \
            -f "log_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --silent

      - name: Deploy (simulated)
        run: |
          echo "Deploying $(git rev-parse --short HEAD) (${TAG}) to ${ENVIRONMENT} ${REGION}"
          sleep 5
          if [ "$SIMULATE_FAILURE" = 'true' ]; then echo 'Simulated failure'; exit 1; fi

      - name: Report deployment status
        if: always() && steps.deployment.outputs.id != ''
        env:
          JOB_STATUS: ${{ job.status }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
        run: |
          state=failure
          [ "$JOB_STATUS" = 'success' ] && state=success
          gh api "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f "state=${state}" \
            -f "description=${TAG} ${state}" \
            -f "environment_url=https://${ENVIRONMENT}${REGION:+.${REGION}}.example.com" \
            -f "log_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -F 'auto_inactive=true' --silent
          echo "Deployment ${DEPLOYMENT_ID}: ${state}" >> "$GITHUB_STEP_SUMMARY"
